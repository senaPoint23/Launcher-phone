name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Ekstrak zip
        run: |
          for z in $(find . -name "*.zip" -not -path "./.git/*"); do
            unzip -o "$z" -d "$(dirname "$z")"
          done
      - name: Build
        run: |
          F=$(find . -name settings.gradle.kts | head -1)
          if [ -z "$F" ]; then echo "settings.gradle.kts tidak ada di repo"; exit 1; fi
          gradle -p "$(dirname "$F")" :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AquaLauncher-debug
          path: "**/app-debug.apk"
